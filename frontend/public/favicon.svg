<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Black background -->
  <rect width="64" height="64" rx="10" fill="#000000"/>
  <!-- Green border -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="none" stroke="#00e676" stroke-width="2.5"/>

  <!-- Envelope body -->
  <rect x="9" y="7" width="46" height="30" rx="2" fill="none" stroke="#00e676" stroke-width="2.5"/>
  <!-- Envelope flap (M / chevron) -->
  <polyline points="9,7 32,24 55,7" fill="none" stroke="#00e676" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="3" y1="41" x2="61" y2="41" stroke="#00e676" stroke-width="2"/>

  <!-- G letter (bold, simple) -->
  <path d="M22,57 A9,9 0 1,1 22,49 L18,49" fill="none" stroke="#00e676" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M letter -->
  <polyline points="29,57 29,49 37,55 45,49 45,57" fill="none" stroke="#00e676" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
